---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: lto
description: butrelinux lto

base-image: quay.io/centos-bootc/centos-bootc
image-version: c10s
modules:
  - from-file: common/common.yml
  
  - type: custom-kernel
    source: ghcr.io/butrelinux/modules
    kernel: cachyos-lto
    initramfs: true
    nvidia: false

  - type: image-info
    source: ghcr.io/butrelinux/modules
    variant: lto  
  
  - from-file: common/end.yml
