---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: hyperscale-nvidia
description: butrelinux hyperscale with nvidia support

base-image: quay.io/centos-bootc/centos-bootc
image-version: c10s
modules:
  - from-file: common/common.yml

  - type: custom-kernel
    source: ghcr.io/butrelinux/modules
    kernel: hyperscale
    initramfs: true
    nvidia: true

  - type: image-info
    source: ghcr.io/butrelinux/modules
    variant: hyperscale-nvidia
  
  - from-file: common/end.yml
