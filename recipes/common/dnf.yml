modules:
  - type: dnf
    remove:
      packages:
        - linux-firmware
        - rhc
        - insights-client
        - insights-core
        - subscription-manager
  - type: dnf
    install:
      packages:

        # gstreamer stack
        - gstreamer1
        - gstreamer1-plugin-libav
        - gstreamer1-plugins-bad-free
        - gstreamer1-plugins-bad-free-libs
        - gstreamer1-plugins-base
        - gstreamer1-plugins-base-tools
        - gstreamer1-plugins-good
        - gstreamer1-plugins-ugly-free
        - gstreamer1-svt-av1
        - gstreamer1-svt-vp9
        - libcamera-gstreamer
        - libnice-gstreamer1
        - lsp-plugins-gstreamer
        - pipewire-gstreamer
        - vlc-plugin-gstreamer

        # firmware
        - linux-firmware
        - amd-ucode-firmware
        - amd-gpu-firmware
        - intel-gpu-firmware
        - nvidia-gpu-firmware
        - alsa-firmware
        - alsa-sof-firmware
        - intel-audio-firmware
        - realtek-firmware
        - atheros-firmware
        - iwlwifi-dvm-firmware
        - iwlwifi-mvm-firmware
        - cirrus-audio-firmware
        - brcmfmac-firmware
        - iwlegacy-firmware
        - libertas-firmware
        - mt7xxx-firmware
        - nxpwireless-firmware
        - qcom-firmware
        - tiwilink-firmware
        - intel-vsc-firmware
        - dvb-firmware
        - mlxsw_spectrum-firmware
        - mrvlprestera-firmware
        - netronome-firmware
        - uhd-firmware
        - iscan-firmware
        - linux-firmware

        # network manager
        - NetworkManager-wifi
        - NetworkManager-tui
        - NetworkManager-openvpn
        - NetworkManager-openconnect
        - NetworkManager-l2tp
        - NetworkManager-libreswan
        - NetworkManager-wwan
        - NetworkManager-bluetooth
        - NetworkManager-ppp
        - kf6-networkmanager-qt
        - NetworkManager

        # selinux
        - khelpcenter
        - policycoreutils
        - policycoreutils-python-utils
        - policycoreutils-devel
        - selinux-policy-targeted
        - libsemanage

        # kde
        - kde-partitionmanager
        - krfb
        - krdc
        - plasma-desktop
        - plasma-workspace-wayland
        - kde-settings-plasma
        - flatpak-kcm
        - kscreen
        - kinfocenter
        - sddm
        - sddm-kcm
        - sddm-breeze
        - polkit-kde
        - plasma-nm
        - plasma-disks
        - plasma-browser-integration
        - kde-connect
        - bluedevil
        - dolphin
        - konsole
        - kio-admin
        - ark
        - spectacle
        - okular
        - plasma-systemmonitor
        - kde-gtk-config
        - kcalc
        - xdg-desktop-portal-kde
        - plasma-pa

        # core bits
        - powerdevil
        - tuned
        - tuned-ppd
        - tuned-profiles-atomic
        - earlyoom
        - pipewire 
        - pipewire-pulseaudio
        - pipewire-alsa
        - wireplumber
        - pipewire-jack-audio-connection-kit
        - alsa-firmware
        - pipewire-utils
        - firewalld
        - zram-generator

        # userspace
        - nvtop
        - distrobox
        - lm_sensors
        - htop

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - plasma-discover
        - plasma-discover-flatpak
        - plasma-discover-libs
        - plasma-discover-kns

  - type: fedora-rpm
    source: local
    releasever: "44"
    repos:
      - https://copr.fedorainfracloud.org/coprs/theblackdon/dcli-bootc/repo/fedora-44/theblackdon-dcli-bootc-fedora-44.repo
    install:
      - dcli-bootc
