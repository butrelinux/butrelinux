modules:
  - type: fonts
    fonts:
      nerd-fonts:
       - JetBrainsMono
       - NerdFontsSymbolsOnly
       - Noto
       
  - type: dnf
    install:
      packages:
        - linux-firmware
        
  - type: systemd
    system:
      enabled:
        - sddm.service
        - tuned.service
        - tuned-ppd.service
        - earlyoom.service
      disabled:
        - nfs-client.target
      masked:
        - rpcbind.service
        - rpcbind.socket
        - system-flatpak-setup.timer
        - systemd-resolved.service

  - type: kargs
    kargs:
      - amdgpu.ppfeaturemask=0xffffffff
      - split_lock_detect=off

  - type: clean-repos
    source: local

  - type: signing
